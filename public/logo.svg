<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" fill="none">
  <defs>
    <style>
      .bi-text { font-family: 'Inter', Arial, sans-serif; font-weight: 800; font-style: italic; }
    </style>
  </defs>
  <!-- Bi block background -->
  <path d="M4 8 L4 52 L88 52 L96 8 Z" fill="#0c1f3d"/>
  <!-- B letter -->
  <text x="12" y="44" class="bi-text" font-size="38" fill="white">B</text>
  <!-- i stem -->
  <text x="48" y="44" class="bi-text" font-size="38" fill="white">i</text>
  <!-- i dot (gold square) -->
  <rect x="56" y="14" width="8" height="8" fill="#f5b800" transform="skewX(-8)"/>
  <!-- GROUP text -->
  <text x="104" y="44" class="bi-text" font-size="36" fill="#0c1f3d">GROUP</text>
  <!-- Registered trademark -->
  <text x="262" y="22" font-family="Arial" font-size="10" fill="#0c1f3d">®</text>
</svg>
